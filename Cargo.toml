[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/kernel",
    "crates/adapters",
    "crates/replay",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/tfrmma/blackswan-harness"

[workspace.dependencies]
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
