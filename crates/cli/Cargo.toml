[package]
name = "blackswan-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "blackswan"
path = "src/main.rs"

[dependencies]
blackswan-core = { path = "../core" }
blackswan-replay = { path = "../replay" }
blackswan-kernel = { path = "../kernel" }
blackswan-adapters = { path = "../adapters" }
serde.workspace = true
toml = "0.7"
indexmap = "=2.2.6"
clap = { version = "=4.4.18", features = ["derive"] }
